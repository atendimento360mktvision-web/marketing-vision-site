<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#232122">
<title>Painel · Marketing Vision</title>
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/painel.css">
</head>
<body>
<header class="top">
  <img src="img/mv-logo-branca.webp" alt="Marketing Vision">
  <div class="top-r"><span class="sync" id="sync" aria-live="polite"></span><button class="ghost sm" id="logout" type="button" hidden>Sair</button></div>
</header>

<form class="login" id="login" hidden>
  <h1>Painel</h1>
  <label for="k">Chave do painel</label>
  <input id="k" type="password" autocomplete="current-password" required>
  <p class="err" id="err"></p>
  <button type="submit">Entrar</button>
</form>

<div id="app" hidden>
  <nav class="tabs" id="tabs" aria-label="Seções do painel"></nav>
  <main id="view"></main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm" novalidate></form></dialog>
<script src="js/painel.js" defer></script>
</body>
</html>
